<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TERRY'S EXAM</title>
<link rel="stylesheet" href="/common.css">
<style>
:root{--brand:#1B5E3B;--accent:#f5b301}
.tag{background:#e6f2ea}
.ch.on{background:#e8f4ec}
.blank{background:#eef7f1}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.grade{background:var(--card);border-radius:16px;padding:26px 8px;text-align:center;font-size:22px;font-weight:800;color:var(--brand);border:2px solid var(--line)}
.grade small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.crumb{font-size:14px;color:var(--muted);margin:2px 0 10px}
.crumb a{color:var(--brand);font-weight:700}
.ghead{font-weight:700;color:var(--brand);font-size:14px;margin:18px 0 8px}
.gpas{background:var(--card);border-radius:14px;padding:4px 14px 2px;margin-bottom:12px}
.expl{margin-top:10px;background:#fff8e1;border:1px solid #f3e1a6;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.55}
.expl b{color:#9a6b00}
.mine{font-size:13px;color:var(--muted);margin-top:8px}
.mine .x{color:var(--no);font-weight:700}.mine .o{color:var(--ok);font-weight:700}
.rvh{font-size:18px;margin:20px 0 10px}
.rv .refp{margin:8px 0}
.rv .refp summary{font-size:13px;color:var(--brand);cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="/config.js"></script>
<script>
const ROOT='exam';
const BRAND=`TERRY'S <span>EXAM</span>`;
const GRADES=['중2','중3','고1'];
const S={setId:null,set:null,name:'',resultId:null,secIdx:0,answers:{},results:{},startedAt:null};
const $=s=>document.querySelector(s); const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CIRC=['①','②','③','④','⑤']; const LS='exam_progress_';
const fb={url:p=>`${CONFIG.dbUrl}/${ROOT}/${p}.json`,get:p=>fetch(fb.url(p)).then(r=>r.json()),put:(p,v)=>fetch(fb.url(p),{method:'PUT',body:JSON.stringify(v)}).then(r=>r.json()),patch:(p,v)=>fetch(fb.url(p),{method:'PATCH',body:JSON.stringify(v)}).then(r=>r.json())};
function norm(s){return String(s||'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ');}
function saveProgress(){try{localStorage.setItem(LS+S.setId,JSON.stringify({name:S.name,resultId:S.resultId,secIdx:S.secIdx,answers:S.answers,results:S.results,startedAt:S.startedAt}));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(LS+S.setId)||'null');}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem(LS+S.setId);}catch(e){}}
function now(){return new Date().toISOString();}
function sections(){return S.set.sections;}
function secMax(s){return s.type==='mc'?s.questions.length:s.parts.reduce((a,p)=>a+p.lines.reduce((b,l)=>b+(l.t.match(/\{\{/g)||[]).length,0),0);}
function totalMax(){return sections().reduce((a,s)=>a+secMax(s),0);}
function render(h){app.innerHTML=h;window.scrollTo(0,0);}
function trapBack(){try{history.pushState({w:1},'');window.onpopstate=()=>{history.pushState({w:1},'');};}catch(e){}}
const hdr=(sticky)=>`<header class="top ${sticky?'sticky':''}"><a class="brand ${sticky?'sm':''}" href="/">${BRAND}</a>${S.name&&sticky?`<div class="who">${esc(S.name)}</div>`:''}</header>`;

async function boot(){
  const u=new URL(location.href);
  S.setId=u.searchParams.get('s');
  if(!S.setId) return showHome(u.searchParams.get('g'),u.searchParams.get('b'));
  render(`<div class="center"><div class="spinner"></div><p>문제 불러오는 중…</p></div>`);
  try{S.set=await fb.get(`sets/${S.setId}`);}catch(e){S.set=null;}
  if(!S.set) return render(`<div class="center"><h2>시험지를 찾을 수 없어요</h2><a class="btn ghost" href="/">처음으로</a></div>`);
  const p=loadProgress();
  if(p&&p.name&&p.secIdx<sections().length){
    S.name=p.name;S.resultId=p.resultId;S.secIdx=p.secIdx;S.answers=p.answers||{};S.results=p.results||{};S.startedAt=p.startedAt;
    return render(`<div class="center card"><h2>이어서 풀기</h2><p><b>${esc(S.name)}</b> 학생, 풀던 시험을 이어서 풀 수 있어요.</p>
      <button class="btn" onclick="trapBack();showSection()">이어서 풀기</button>
      <button class="btn ghost" onclick="clearProgress();S.answers={};S.results={};S.secIdx=0;S.name='';showStart()">처음부터 다시</button></div>`);
  }
  showStart();
}

async function showHome(g,b){
  render(hdr()+`<main class="wrap"><div class="center" style="margin:30px auto"><div class="spinner"></div></div></main>`);
  let meta={}; try{meta=await fb.get('setsMeta')||{};}catch(e){}
  const items=Object.entries(meta).filter(([k,v])=>v&&v.active!==false);
  if(!g){
    return render(hdr()+`<main class="wrap"><h2 class="h">학년을 선택하세요</h2><div class="grades">${GRADES.map(x=>{const n=items.filter(([k,v])=>v.grade===x).length;return `<a class="grade" href="?g=${encodeURIComponent(x)}">${x}<small>${n?n+'개 시험지':'준비 중'}</small></a>`;}).join('')}</div></main>`);
  }
  const inG=items.filter(([k,v])=>v.grade===g);
  const books=[...new Set(inG.map(([k,v])=>v.book||'기타'))];
  if(!b){
    return render(hdr()+`<main class="wrap"><div class="crumb"><a href="/">학년</a> › ${esc(g)}</div><h2 class="h">${esc(g)} — 교재 선택</h2>
      ${books.length?books.map(x=>`<a class="setcard" href="?g=${encodeURIComponent(g)}&b=${encodeURIComponent(x)}"><div class="t">${esc(x)}</div><div class="st">${inG.filter(([k,v])=>(v.book||'기타')===x).length}개 시험지</div></a>`).join(''):'<p class="muted">아직 등록된 시험지가 없어요.</p>'}</main>`);
  }
  const list=inG.filter(([k,v])=>(v.book||'기타')===b).sort((x,y)=>(x[1].order??999)-(y[1].order??999)||(x[1].createdAt||'').localeCompare(y[1].createdAt||''));
  render(hdr()+`<main class="wrap"><div class="crumb"><a href="/">학년</a> › <a href="?g=${encodeURIComponent(g)}">${esc(g)}</a> › ${esc(b)}</div><h2 class="h">${esc(b)}</h2>
    ${list.map(([id,m])=>`<a class="setcard" href="?s=${encodeURIComponent(id)}"><div class="t">${esc(m.title||id)}</div><div class="st">${esc(m.subtitle||'')}</div></a>`).join('')||'<p class="muted">시험지가 없어요.</p>'}</main>`);
}

function showStart(){
  const set=S.set;
  render(hdr()+`<main class="wrap"><div class="card">
    <div class="tag">${esc(set.title)}</div><h1 class="title">${esc(set.subtitle||'')}</h1>
    <ul class="seclist">${sections().map((s,i)=>`<li><span class="num">${i+1}</span>${esc(s.name)}<span class="cnt">${secMax(s)}${s.type==='mc'?'문항':'칸'}</span></li>`).join('')}</ul>
    <label class="lbl">이름</label><input id="nm" class="inp" type="text" placeholder="이름을 입력하세요" autocomplete="off" value="${esc(S.name)}">
    <button class="btn big" onclick="start()">시작하기</button>
    <p class="muted small">제출하면 바로 채점되고, 틀린 문제는 해설과 함께 보여줘요.</p></div></main>`);
  $('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')start();});
}

async function start(){
  const nm=$('#nm').value.trim(); if(!nm){$('#nm').focus();$('#nm').classList.add('err');return;}
  S.name=nm;S.secIdx=0;S.answers={};S.results={};S.startedAt=now();
  let prev=null;
  try{const all=await fb.get(`results/${S.setId}`)||{};const c=Object.entries(all).filter(([k,v])=>v&&v.name===nm&&!v.done&&v.sections).sort((a,b)=>(b[1].lastAt||'').localeCompare(a[1].lastAt||''));if(c.length)prev=c[0];}catch(e){}
  if(prev){S.resultId=prev[0];S.startedAt=prev[1].startedAt||now();sections().forEach(s=>{const x=prev[1].sections[s.id];if(x)S.results[s.id]={score:x.score,total:x.total,detail:x.detail||[]};});const idx=sections().findIndex(s=>!S.results[s.id]);S.secIdx=idx<0?sections().length-1:idx;saveProgress();trapBack();if(idx<0)return showFinal();return showSection();}
  S.resultId=`${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
  saveProgress();
  fb.put(`results/${S.setId}/${S.resultId}`,{name:S.name,startedAt:S.startedAt,setTitle:S.set.title,total:0,totalMax:totalMax(),done:false,lastAt:now()}).catch(()=>{});
  trapBack(); showSection();
}

function progressBar(){return sections().length>1?`<div class="prog">${sections().map((s,i)=>`<div class="seg ${i<S.secIdx?'done':i===S.secIdx?'cur':''}"></div>`).join('')}</div>`:'';}
function qHead(q){return q.head?`<div class="ghead">${q.head}</div>${q.gp?`<div class="gpas"><div class="passage">${q.gp}</div></div>`:''}`:'';}

function showSection(){
  const sec=sections()[S.secIdx];
  let body='';
  if(sec.type==='mc'){
    const saved=S.answers[sec.id]||[];
    body=sec.questions.map((q,i)=>`${qHead(q)}
      <div class="q" id="q${i}"><div class="qn">${String(i+1).padStart(2,'0')}</div><div class="qbody">
        <div class="qt">${q.q}</div>${q.passage?`<div class="passage">${q.passage}</div>`:''}
        <div class="choices">${q.choices.map((c,j)=>`<label class="ch ${saved[i]===j?'on':''}"><input type="radio" name="q${i}" value="${j}" ${saved[i]===j?'checked':''} onchange="pick(${i},${j})"><span class="c">${CIRC[j]}</span><span class="ct">${c}</span></label>`).join('')}</div>
      </div></div>`).join('');
  } else body=`<p class="intro">${esc(sec.intro||'')}</p>`+renderCloze(sec);
  render(hdr(1)+`<div class="wrap">${progressBar()}<div class="sechead"><span class="num">${S.secIdx+1}</span><h2>${esc(sec.name)}</h2><span class="cnt">${secMax(sec)}${sec.type==='mc'?'문항':'칸'}</span></div>`+body+`<div class="submitbar"><button class="btn big" onclick="submitSection()">제출하고 채점하기</button></div></div>`);
}
function pick(i,j){const sec=sections()[S.secIdx];S.answers[sec.id]=S.answers[sec.id]||[];S.answers[sec.id][i]=j;document.querySelectorAll(`#q${i} .ch`).forEach((el,k)=>el.classList.toggle('on',k===j));saveProgress();}
let clozeIdx=0;
function renderCloze(sec){clozeIdx=0;const saved=S.answers[sec.id]||[];return sec.parts.map(p=>`<div class="part"><h3>${esc(p.title)}</h3>${p.lines.map(l=>{const html=l.t.replace(/\{\{([^}]+)\}\}/g,(m,ans)=>{const k=clozeIdx++;const first=ans.split('|')[0];return `<input class="blank" data-k="${k}" style="width:${Math.min(42,Math.max(5,(/[가-힣]/.test(first)?first.length*1.7:first.length*0.8)+2))}ch" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(saved[k]||'')}" oninput="typed(${k},this.value)">`;});return `<div class="line">${l.s?`<span class="sp">${esc(l.s)}</span>`:l.n?`<span class="sp n">${String(l.n).padStart(2,'0')}</span>`:''}<span class="lt">${html}</span></div>`;}).join('')}</div>`).join('');}
function typed(k,v){const sec=sections()[S.secIdx];S.answers[sec.id]=S.answers[sec.id]||[];S.answers[sec.id][k]=v;saveProgress();}
function gradeMC(sec){const a=S.answers[sec.id]||[];let score=0;const detail=sec.questions.map((q,i)=>{const ok=a[i]===q.answer;if(ok)score++;return {a:a[i]??null,ok,c:q.answer};});return {score,total:sec.questions.length,detail};}
function gradeCloze(sec){const a=S.answers[sec.id]||[];let k=0,score=0;const detail=[];sec.parts.forEach(p=>p.lines.forEach(l=>{l.t.replace(/\{\{([^}]+)\}\}/g,(m,ans)=>{const alts=ans.split('|').map(norm);const g=a[k]||'';const ok=alts.includes(norm(g));if(ok)score++;detail.push({a:g,ok,c:ans.split('|')[0]});k++;return m;});}));return {score,total:k,detail};}

async function submitSection(){
  const sec=sections()[S.secIdx];const a=S.answers[sec.id]||[];const max=secMax(sec);
  let miss=0;for(let i=0;i<max;i++){if(a[i]===undefined||a[i]===null||a[i]==='')miss++;}
  if(miss>0&&!confirm(`아직 ${miss}문항을 안 풀었어요. 그래도 제출할까요?`))return;
  const r=sec.type==='mc'?gradeMC(sec):gradeCloze(sec); S.results[sec.id]=r; saveProgress();
  const btn=$('.submitbar .btn');btn.disabled=true;btn.textContent='채점 중…';
  const sum=Object.values(S.results).reduce((x,y)=>x+y.score,0); const done=S.secIdx===sections().length-1;
  try{
    await fb.patch(`results/${S.setId}/${S.resultId}`,{name:S.name,total:sum,totalMax:totalMax(),done,lastAt:now(),...(done?{submittedAt:now()}:{})});
    await fb.patch(`results/${S.setId}/${S.resultId}/sections`,{[sec.id]:{name:sec.name,score:r.score,total:r.total,detail:r.detail,submittedAt:now()}});
  }catch(e){}
  if(done) showFinal(); else showSectionResult(sec,r);
}

function reviewMC(sec,r){
  const wrong=sec.questions.map((q,i)=>[q,i]).filter(([q,i])=>!r.detail[i]?.ok);
  if(!wrong.length) return `<div class="card center" style="margin:0 0 12px">🎉 모두 맞았어요!</div>`;
  return wrong.map(([q,i])=>{const d=r.detail[i];const ref=q.ref!=null?sec.questions[q.ref]:null;const gp=q.gp||(ref&&ref.gp);
    return `<div class="q rv" style="margin-bottom:12px"><div class="qn">${String(i+1).padStart(2,'0')}</div><div class="qbody">
      ${gp?`<details class="refp"><summary>지문 보기</summary><div class="passage">${gp}</div></details>`:''}
      <div class="qt">${q.q}</div>${q.passage?`<div class="passage">${q.passage}</div>`:''}
      <div class="choices">${q.choices.map((c,j)=>`<div class="ch ${j===q.answer?'right':''} ${j===d.a&&j!==q.answer?'wrong':''}"><span class="c">${CIRC[j]}</span><span class="ct">${c}</span></div>`).join('')}</div>
      <div class="mine">내 답 <span class="x">${d.a!=null?CIRC[d.a]:'미답'}</span> · 정답 <span class="o">${CIRC[q.answer]}</span></div>
      ${q.e?`<div class="expl"><b>해설</b> ${q.e}</div>`:''}</div></div>`;}).join('');
}
function reviewCloze(sec,r){let k=0;return `<div class="part review-cloze">${sec.parts.map(p=>`<h3>${esc(p.title)}</h3>${p.lines.map(l=>{const html=l.t.replace(/\{\{([^}]+)\}\}/g,()=>{const d=r.detail[k++];return d.ok?`<span class="bk ok">${esc(d.c)}</span>`:`<span class="bk no"><s>${esc(d.a||'　')}</s> ${esc(d.c)}</span>`;});return `<div class="line">${l.s?`<span class="sp">${esc(l.s)}</span>`:l.n?`<span class="sp n">${String(l.n).padStart(2,'0')}</span>`:''}<span class="lt">${html}</span></div>`;}).join('')}`).join('')}</div>`;}

function showSectionResult(sec,r){
  render(hdr(1)+`<div class="wrap">${progressBar()}<div class="scorecard"><div class="lab">${esc(sec.name)} 결과</div><div class="big">${r.score}<span>/ ${r.total}</span></div><div class="pct">${Math.round(r.score/r.total*100)}점</div></div>
  ${sec.type==='mc'?`<div class="grid">${r.detail.map((d,i)=>`<div class="cell ${d.ok?'ok':'no'}">${i+1}</div>`).join('')}</div><h3 class="rvh">오답 풀이</h3>${reviewMC(sec,r)}`:reviewCloze(sec,r)}
  <div class="submitbar"><button class="btn big" onclick="S.secIdx++;saveProgress();showSection()">다음 섹션 →</button></div></div>`);
}

function showFinal(){
  const sum=Object.values(S.results).reduce((x,y)=>x+y.score,0);const max=totalMax();
  clearProgress();
  const multi=sections().length>1;
  render(hdr()+`<main class="wrap" style="padding-bottom:40px">
    <div class="scorecard final"><div class="lab">${esc(S.name)} · ${esc(S.set.title)}</div><div class="big">${sum}<span>/ ${max}</span></div><div class="pct">${Math.round(sum/max*100)}점</div></div>
    ${multi?`<table class="tbl">${sections().map(s=>{const r=S.results[s.id]||{score:0,total:secMax(s)};return `<tr><td>${esc(s.name)}</td><td class="r"><b>${r.score}</b> / ${r.total}</td></tr>`;}).join('')}</table>`:''}
    ${sections().map(s=>{const r=S.results[s.id];if(!r)return '';return `${multi?`<h3 class="rvh">${esc(s.name)}</h3>`:''}${s.type==='mc'?`<div class="grid">${r.detail.map((d,i)=>`<div class="cell ${d.ok?'ok':'no'}">${i+1}</div>`).join('')}</div><h3 class="rvh">오답 풀이 (${r.detail.filter(d=>!d.ok).length}문항)</h3>${reviewMC(s,r)}`:reviewCloze(s,r)}`;}).join('')}
    <p class="muted center">결과가 선생님께 전송됐어요. 수고했어요!</p>
    <a class="btn ghost" href="/">처음으로</a>
  </main>`);
}
boot();
</script>
</body>
</html>
